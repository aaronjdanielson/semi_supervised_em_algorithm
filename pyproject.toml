[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "semi-supervised-gmm"
version = "0.1.0"
description = "Semi-supervised Gaussian mixture classifier with a weighted unlabeled likelihood"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
  { name = "The Authors" },
]
keywords = [
  "semi-supervised learning",
  "gaussian mixture model",
  "expectation maximization",
  "classification",
  "machine learning",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-cov",
]
examples = [
  "matplotlib>=3.5",
]

[project.urls]
Homepage = "https://github.com/the-authors/semi-supervised-gmm"
Documentation = "https://github.com/the-authors/semi-supervised-gmm#readme"
"Bug Tracker" = "https://github.com/the-authors/semi-supervised-gmm/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["semi_supervised_gmm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
